<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MomCare – Daftar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="phone-frame">
    <div class="app-content" style="justify-content: center; padding-bottom: 24px;">
      
      <div class="auth-illustration">🌸</div>
      
      <div class="auth-brand">
        <h1>Daftar MomCare</h1>
        <p>Mulai pemantauan masa nifas Anda</p>
      </div>

      <div id="alertBox" class="alert hidden"></div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label">Nama Lengkap</label>
          <input id="nama" type="text" class="form-input" placeholder="Nama Ibu" required />
        </div>
        <div class="form-group">
          <label class="form-label">Alamat Email</label>
          <input id="email" type="email" class="form-input" placeholder="ibu.sehat@email.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input id="password" type="password" class="form-input" placeholder="Minimal 6 karakter" required />
        </div>
        <div class="form-group">
          <label class="form-label">Tanggal Melahirkan</label>
          <input id="tanggalMelahirkan" type="date" class="form-input" required />
        </div>
        
        <button type="submit" class="btn-primary btn-full" id="registerBtn" style="margin-top: 10px;">
          <span class="btn-text">Daftar Akun</span>
          <span class="btn-loader hidden">⏳</span>
        </button>
      </form>

      <div class="auth-btn-row">
        <span>Sudah memiliki akun? &nbsp;</span>
        <a href="index.html" class="link-pink">Masuk ke Akun</a>
      </div>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
